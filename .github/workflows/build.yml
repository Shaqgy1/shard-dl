name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Sanity check
        run: |
          python -c "import shard; print(shard.APP_NAME, shard.__version__)"
          python -c "from shard.config import Options; from shard.ytdlp import build_args, format_command; print(format_command('yt-dlp', build_args(Options(), 'URL', for_display=True)))"

      - name: Smoke test the UI (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import sys
          from PySide6.QtWidgets import QApplication
          from shard.main_window import MainWindow
          from shard.theme import THEME_ORDER
          app = QApplication(sys.argv)
          w = MainWindow(); w.show()
          for name in THEME_ORDER:
              w.options_panel.theme.setCurrentIndex(w.options_panel.theme.findData(name))
              app.processEvents()
              assert w.palette_obj.name == name
          assert w.options_panel.count() == 10
          print('UI smoke test passed:', len(THEME_ORDER), 'themes,', w.options_panel.count(), 'sections')
          "

      - name: Build the executable
        run: python -m PyInstaller build.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shard-exe
          path: dist/Shard.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Shard.exe
          generate_release_notes: true
