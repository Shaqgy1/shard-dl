[project]
name = "shard-dl"
version = "1.0.0"
description = "A neon GUI for yt-dlp - every option exposed, with a real download queue."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Shaqgy" }]
keywords = ["yt-dlp", "youtube-dl", "downloader", "gui", "qt", "pyside6", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = ["PySide6-Essentials>=6.6"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pillow>=10.0"]

[project.urls]
Homepage = "https://github.com/Shaqgy1/shard-dl"
Issues = "https://github.com/Shaqgy1/shard-dl/issues"
Changelog = "https://github.com/Shaqgy1/shard-dl/blob/main/CHANGELOG.md"

[project.gui-scripts]
shard = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shard"]
py-modules = ["main"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
